upstream lumi_backend {
    server backend:80;
}

server {
    listen 80;
    server_name _;

    # Allow large EPUB / avatar uploads
    client_max_body_size 100M;

    # Reverse-proxy Rails API, ActionCable, ActiveStorage, health
    location ~ ^/(v1|csrf|cable|up|rails)(/|$) {
        proxy_pass http://lumi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /cable
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA static assets + fallback to index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
